[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remax-rl"
version = "0.1.0"
description = "Re:Max and Re:Dr verified replay for reinforcement learning with verifiable rewards"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["modebench==0.4.0", "torch>=2.6,<2.7", "numpy>=1.26.4,<3"]

[project.optional-dependencies]
train = ["oat-llm==0.1.3.post1", "transformers==4.51.3", "vllm==0.8.4", "deepspeed==0.16.8", "datasets==2.16.1", "numpy==1.26.4", "pyarrow==11.0.0", "dm-tree", "latex2sympy2-extended", "math-verify", "pylatexenc", "tqdm"]
dev = ["pytest", "math-verify==0.7.0", "latex2sympy2-extended==1.10.1", "pylatexenc==2.10", "ruff==0.12.12", "mypy==1.17.1"]

[project.scripts]
remax = "remax.cli:main"
remax-run = "remax.launcher:main"

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[project.urls]
Repository = "https://github.com/liv-daliberti/remax"
Documentation = "https://github.com/liv-daliberti/remax#readme"
Issues = "https://github.com/liv-daliberti/remax/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.setuptools.package-data]
remax = ["input_registry_v1.json", "modebench_release_v1.json", "py.typed"]

# Gradual adoption: lint/format all maintained core modules. Historical runtime
# snapshots, comparator integrations and numerical reference artifacts are excluded.
[tool.ruff]
target-version = "py310"
line-length = 88
include = ["src/remax/core/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
files = [
  "src/remax/core/bank_types.py", "src/remax/core/replay_types.py",
  "src/remax/core/objectives.py", "src/remax/core/scoring.py",
  "src/remax/core/metrics.py", "src/remax/core/execution.py",
]
