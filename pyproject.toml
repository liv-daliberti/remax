[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remax-rl"
version = "0.1.0"
description = "Re:Max and Re:Dr verified replay for reinforcement learning with verifiable rewards"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["modebench @ git+https://github.com/liv-daliberti/modeBench.git@94c45d1f66d3eb181fac2225dc04d62e08568b8e", "torch>=2.6", "numpy>=1.26.4"]

[project.optional-dependencies]
train = ["oat-llm==0.1.3.post1", "transformers==4.51.3", "vllm==0.8.4", "deepspeed==0.16.8", "datasets==2.16.1", "dm-tree", "latex2sympy2-extended", "math-verify", "pylatexenc", "tqdm"]
dev = ["pytest", "math-verify==0.7.0", "latex2sympy2-extended==1.10.1", "pylatexenc==2.10"]

[project.urls]
Repository = "https://github.com/liv-daliberti/remax"
Documentation = "https://github.com/liv-daliberti/remax/tree/main/docs"
Issues = "https://github.com/liv-daliberti/remax/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
