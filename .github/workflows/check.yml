name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'torch==2.6.0+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Preserve frozen training references from PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python ops/check_training_reference.py --base-ref "$BASE_SHA"
      - run: make check
      - run: python examples/replay_loss.py
      - run: python ops/verify_release.py
