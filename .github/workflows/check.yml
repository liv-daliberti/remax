name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install build
      # Default build creates the wheel FROM the sdist in isolation.
      - run: python -m build
      - name: Preserve frozen references
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python ops/check_training_reference.py --base-ref "$BASE_SHA"
      - run: python ops/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*
            requirements-gpu-py310-cu124.txt
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev]'
      - run: make quality
  installed:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
        artifact: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Create clean core-only environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/remax-env"
          echo "$RUNNER_TEMP/remax-env/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/remax-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/remax-env/bin/python" -m pip install 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          if [ '${{ matrix.artifact }}' = wheel ]; then
            artifact=$(find dist -name '*.whl' -print -quit | xargs realpath)
            "$RUNNER_TEMP/remax-env/bin/python" -m pip install 'numpy==1.26.4'
          else
            artifact=$(find dist -name '*.tar.gz' -print -quit | xargs realpath)
            "$RUNNER_TEMP/remax-env/bin/python" -m pip install 'numpy>=2,<3'
          fi
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/remax-env/bin/python" -m pip install "$artifact"
          "$RUNNER_TEMP/remax-env/bin/python" -m pip check
      - name: Documented workflow outside checkout, core only
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/remax-user"
          cp tests/installed/smoke.py "$RUNNER_TEMP/remax-user/smoke.py"
          cd "$RUNNER_TEMP/remax-user"
          unset PYTHONPATH PYTHONHOME
          python -I smoke.py
      - name: Installed regression suite outside checkout
        shell: bash
        run: |
          python -m pip install "$ARTIFACT[dev]"
          python -m pip check
          mkdir "$RUNNER_TEMP/remax-regression"
          cp -r tests ops configs evidence protocols examples pyproject.toml "$RUNNER_TEMP/remax-regression/"
          cd "$RUNNER_TEMP/remax-regression"
          unset PYTHONPATH PYTHONHOME
          python -m pytest --import-mode=importlib -q
          python ops/reproduce_training.py
          python ops/check_training_reference.py
          bash -n ops/train.sh ops/repo_env.sh ops/setup_gpu_environment.sh
